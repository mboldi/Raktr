name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Docker
    uses: BSStudio/.github/.github/workflows/shared-publish.yml@14e6deaf34d65dd4db67c19f146449c1cf99c1cc # v1.3.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      images: |
        [
          {"component": "backend", "context": "backend"},
          {"component": "frontend", "context": "frontend"}
        ]
    secrets:
      sentry-auth-token: ${{ github.ref_type == 'tag' && secrets.SENTRY_AUTH_TOKEN || '' }}
