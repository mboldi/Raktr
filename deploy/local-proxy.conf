# Serves the whole stack under one origin: /api to the backend, everything
# else to the frontend. Keeping this out of the frontend image means that
# image is pure static files and needs no per-environment config.
server {
    listen 80;
    server_name _;

    # The trailing slash on proxy_pass strips the /api prefix, so the backend
    # still sees /v1/... Drop it if the backend ever serves under /api itself.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
