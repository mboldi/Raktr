server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The app calls the API on its own origin, so an /api request reaching the
    # static image means nothing is mapping /api to the backend. Fail loudly
    # instead of letting the SPA fallback answer it with index.html and 200.
    # Must stay above the static-asset regex: first matching regex wins.
    location ~ ^/api(/|$) {
        return 404;
    }

    # cache static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
