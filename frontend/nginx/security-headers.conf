# Included by every level of default.conf that sets an add_header of its own: nginx
# inherits add_header from the parent level only while the current level declares none,
# so a location adding one would otherwise silently serve without these.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
