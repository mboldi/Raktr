<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content class="mt-3" style="height: 100%; max-height: 80vh">
  <app-container-form
    [containerData]="containerData"
    [duplicateFrom]="duplicateFrom"
    (formChanged)="onFormChanged($event)"
    (addDevice)="onAddDevice($event)"
    (deviceNotFound)="onDeviceNotFound()"
    (removeDevice)="onRemoveDevice($event)"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Vissza</button>
  <button mat-raised-button color="primary" (click)="save()">Mentés</button>
</mat-dialog-actions>
