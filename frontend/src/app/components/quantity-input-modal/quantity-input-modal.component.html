<h2 mat-dialog-title>Mennyiség megadása</h2>

<mat-dialog-content class="mt-3" style="max-height: 100vh">
  <p>{{ promptText }}</p>
  <mat-form-field class="full-width">
    <mat-label>Mennyiség</mat-label>
    <input
      matInput
      type="number"
      [min]="1"
      [max]="maxQuantity"
      [formControl]="quantityFormControl"
      (keyup.enter)="save()"
    />
    <span matSuffix style="padding-right: 4px">db&nbsp;</span>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Mégse</button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="quantityFormControl.invalid"
    (click)="save()"
  >
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
