<div class="container-fluid" style="padding-right: 24px">
  <div class="row">

    <div class="col-xl-7 col-lg-10 col-md-12">
      <mat-card class="card-with-icon">
        <mat-card-header style="padding-bottom: 16px">
          <h4 class="card-header-text bg-blue">Körös adatok</h4>
        </mat-card-header>
        <mat-card-content>
          <div class="container-fluid">

            <div class="row">
              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Kör neve</mat-label>
                  <input matInput [formControl]="groupNameFormControl">
                </mat-form-field>
              </div>

              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Körvezető neve</mat-label>
                  <input matInput [formControl]="groupLeaderNameFormControl">
                </mat-form-field>
              </div>
            </div>

            <div class="full-width" style="display: flex; justify-content: end">
              <button matButton="filled" color="primary" (click)="saveGroupData()">Mentés</button>
            </div>

          </div>

        </mat-card-content>

      </mat-card>

      <mat-card class="card-with-icon mt-5">
        <mat-card-header style="padding-bottom: 16px">
          <h4 class="card-header-text bg-blue">Egyéb fontos emberek</h4>
        </mat-card-header>
        <mat-card-content>
          <div class="container-fluid">

            <div class="row">
              <h6>Első aláíró, KB részéről</h6>
            </div>

            <div class="row">
              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Neve</mat-label>
                  <input matInput [formControl]="firstSignerNameFormControl">
                </mat-form-field>
              </div>

              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Titulusa</mat-label>
                  <input matInput [formControl]="firstSignerTitleFormControl">
                </mat-form-field>
              </div>
            </div>

            <div class="row">
              <h6>Második aláíró, HSZI részéről</h6>
            </div>

            <div class="row">
              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Neve</mat-label>
                  <input matInput [formControl]="secondSignerNameFormControl">
                </mat-form-field>
              </div>

              <div class="col-lg-6 col-md-12">
                <mat-form-field class="full-width">
                  <mat-label>Titulusa</mat-label>
                  <input matInput [formControl]="secondSignerTitleFormControl">
                </mat-form-field>
              </div>
            </div>

            <div class="full-width" style="display: flex; justify-content: end">
              <button matButton="filled" color="primary" (click)="saveGlobalData()">Mentés</button>
            </div>

          </div>

        </mat-card-content>

      </mat-card>

    </div>

  </div>
</div>
