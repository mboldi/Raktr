@if (isMobile() && !sidebarOpen) {
  <button mat-icon-button class="menu-toggle-button" (click)="toggleSidebar()" aria-label="Menü megnyitása">
    <mat-icon>menu</mat-icon>
  </button>
}

<div class="layout-row">
  @if (isMobile() && sidebarOpen) {
    <!-- Decorative click-to-dismiss overlay: the panel it closes has its own
         close button, so it stays hidden from assistive tech. -->
    <div class="sidebar-backdrop" aria-hidden="true" (click)="closeSidebar()"></div>
  }

  <app-sidebar [class.mobile]="isMobile()" [class.open]="sidebarOpen"></app-sidebar>

  <div class="content-outlet" [class.mobile]="isMobile()">
    <router-outlet></router-outlet>
  </div>
</div>
